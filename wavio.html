<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WaVio // Headless Shell</title>
    <link rel="stylesheet" href="/src/wavio.css">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        .nav-link { 
            font-family: 'Arial', sans-serif;
            font-weight: 100;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            font-size: 12px;
            color: rgba(255,255,255,0.7);
            transition: all 0.3s ease;
            cursor: pointer;
            background: none;
            border: none;
        }
        .nav-link:hover { color: #fff; }
        .nav-link.active { color: #22d3ee; font-weight: 900; }
        
        .hardware-border {
            border: 1px solid rgba(0,0,0,1);
            ring: 12px solid #001f3f;
            outline: 1px solid rgba(255,255,255,0.1);
        }

        .settings-panel {
            position: fixed;
            top: 0;
            right: -320px;
            width: 320px;
            height: 100%;
            background: #001f3f;
            z-index: 200;
            transition: right 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            border-left: 1px solid rgba(255,255,255,0.1);
            padding: 2rem;
        }
        .settings-panel.open { right: 0; }

        .chevron-btn {
            position: fixed;
            top: 50%;
            transform: translateY(-50%);
            z-index: 150;
            background: none;
            border: none;
            color: rgba(255,255,255,0.2);
            cursor: pointer;
            transition: all 0.3s ease;
            padding: 2rem;
        }
        .chevron-btn:hover { color: #fff; transform: translateY(-50%) scale(1.1); }
    </style>
</head>
<body class="bg-[#000814] text-white overflow-hidden font-sans">
    
    <!-- Global Continuous Background -->
    <div id="global-bg" class="fixed inset-0 z-0">
        <video id="bg-video" autoPlay loop muted playsinline class="w-full h-full object-cover opacity-30 mix-blend-screen scale-105" src="/WavioWorld/video/Amazingly_Beautiful_3D_Aquarium_Live_Wallpaper_Wallpaper.mp4"></video>
        <div id="bg-overlay" class="absolute inset-0 bg-gradient-to-r from-[#001f3f]/80 via-transparent to-[#001f3f]/80"></div>
    </div>

    <!-- Chevron Background Switchers -->
    <button onclick="shell.cycleBackground(-1)" class="chevron-btn left-0"><i data-lucide="chevron-left" size="48"></i></button>
    <button onclick="shell.cycleBackground(1)" class="chevron-btn right-0"><i data-lucide="chevron-right" size="48"></i></button>

    <!-- Static Top Nav -->
    <nav class="fixed top-0 left-0 w-full z-[100] bg-[#001f3f] border-b border-white/5 h-16 flex items-center px-8 shadow-2xl">
        <div class="flex-1 flex items-center gap-6">
            <button onclick="shell.toggleSettings()" class="text-white/40 hover:text-white transition-colors"><i data-lucide="settings" size="18"></i></button>
            <div id="nav-brand" class="text-xl font-black italic tracking-tighter">WaVio</div>
        </div>
        <div class="flex-[2] flex justify-center items-center gap-10">
            <button onclick="shell.navigate('home')" id="link-home" class="nav-link">Home</button>
            <button onclick="shell.navigate('dashboard')" id="link-dashboard" class="nav-link">Dashboard</button>
            <button onclick="shell.navigate('gestures')" id="link-gestures" class="nav-link">Gestures</button>
            <button onclick="shell.navigate('architect')" id="link-architect" class="nav-link">Architect</button>
        </div>
        <div class="flex-1 flex justify-end items-center gap-6">
            <button onclick="shell.toggleMute()" class="text-white/40 hover:text-white transition-colors"><i id="mute-icon" data-lucide="volume-2" size="18"></i></button>
        </div>
    </nav>

    <!-- Settings Sidebar -->
    <div id="settings-panel" class="settings-panel shadow-3xl">
        <div class="flex justify-between items-center mb-12">
            <h3 class="text-xs font-black uppercase tracking-[0.3em] text-cyan-400">System_Settings</h3>
            <button onclick="shell.toggleSettings()" class="text-white/20 hover:text-white"><i data-lucide="x" size="18"></i></button>
        </div>
        <div class="space-y-8">
            <div class="space-y-4">
                <label class="text-[10px] font-black uppercase tracking-widest text-white/30">Location_Logic</label>
                <button class="w-full flex items-center justify-between p-4 bg-white/5 rounded-2xl border border-white/10 hover:border-cyan-500 transition-all group">
                    <span class="text-xs uppercase tracking-widest">Where's My Door</span>
                    <i data-lucide="door-open" size="14" class="text-cyan-500"></i>
                </button>
            </div>
            <div class="space-y-4">
                <label class="text-[10px] font-black uppercase tracking-widest text-white/30">Acoustic_Array</label>
                <div class="flex items-center justify-between p-4 bg-white/5 rounded-2xl border border-white/10">
                    <span class="text-xs uppercase tracking-widest">Ping Status</span>
                    <div class="w-10 h-5 bg-cyan-500/20 rounded-full relative p-1"><div class="w-3 h-3 bg-cyan-500 rounded-full"></div></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Main Dynamic Container -->
    <div id="app-shell" class="relative z-10 min-h-screen w-full"></div>

    <!-- Global Privacy Footer -->
    <footer class="fixed bottom-6 w-full flex justify-center z-50 pointer-events-none">
        <div class="opacity-20 flex flex-col items-center">
            <p id="footer-privacy" class="text-[8px] font-bold uppercase tracking-[0.3em]"></p>
        </div>
    </footer>

    <script src="/src/wavio-shell.js" type="module"></script>
</body>
</html>
