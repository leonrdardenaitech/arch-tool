<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WaVio // Headless Shell</title>
    <link rel="stylesheet" href="/src/wavio.css">
    <style>
        .nav-link { 
            font-family: 'Arial', sans-serif;
            font-weight: 100;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            font-size: 12px;
            color: rgba(255,255,255,0.7);
            transition: all 0.3s ease;
            cursor: pointer;
            background: none;
            border: none;
        }
        .nav-link:hover { color: #fff; }
        .nav-link.active { color: #22d3ee; font-weight: 900; }
        
        .animate-fade-in { animation: fadeIn 0.5s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="bg-[#000814] text-white overflow-hidden font-sans">
    <!-- Global Continuous Background -->
    <div id="global-bg" class="fixed inset-0 z-0">
        <video id="bg-video" autoPlay loop muted playsinline class="w-full h-full object-cover opacity-20 mix-blend-screen scale-105" src="/WavioWorld/video/Amazingly_Beautiful_3D_Aquarium_Live_Wallpaper_Wallpaper.mp4"></video>
        <div class="absolute inset-0 bg-gradient-to-b from-[#000814] via-transparent to-[#000814]"></div>
    </div>

    <!-- Static Top Nav -->
    <nav class="fixed top-0 left-0 w-full z-[100] bg-[#001f3f] border-b border-white/5 h-16 flex items-center px-8 shadow-2xl">
        <div class="flex-1 flex items-center gap-6">
            <div id="nav-brand" class="text-xl font-black italic tracking-tighter">WaVio</div>
        </div>
        <div class="flex-[2] flex justify-center items-center gap-10">
            <button onclick="window.shell.navigate('home')" id="link-home" class="nav-link">Home</button>
            <button onclick="window.shell.navigate('dashboard')" id="link-dashboard" class="nav-link">Dashboard</button>
            <button onclick="window.shell.navigate('gestures')" id="link-gestures" class="nav-link">Gestures</button>
            <button onclick="window.shell.navigate('architect')" id="link-architect" class="nav-link">Architect</button>
        </div>
        <div class="flex-1"></div>
    </nav>

    <!-- Main Dynamic Container -->
    <div id="app-shell" class="relative z-10 min-h-screen w-full"></div>

    <!-- Global Privacy Footer -->
    <footer class="fixed bottom-6 w-full flex justify-center z-50 pointer-events-none">
        <div class="opacity-20 flex flex-col items-center">
            <p id="footer-privacy" class="text-[8px] font-bold uppercase tracking-[0.3em]"></p>
        </div>
    </footer>

    <!-- JavaScript Brain -->
    <script src="/src/wavio-shell.js" type="module"></script>
</body>
</html>
