<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Burn-1 Systems</title>
  <meta name="robots" content="noindex, nofollow">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #030408;
    }
    .video-viewport {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      z-index: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #030408;
    }
    .background-video {
      position: absolute;
      top: 50%;
      left: 50%;
      min-width: 100%;
      min-height: 100%;
      width: auto;
      height: auto;
      transform: translate(-50%, -50%);
      object-fit: cover;
    }
    .ambient-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at center, transparent 40%, rgba(3, 4, 8, 0.45) 100%);
      pointer-events: none;
      z-index: 2;
    }
    /* Anchor preservation for legacy inbound links */
    #simulator {
      position: absolute;
      top: 0;
      left: 0;
      width: 1px;
      height: 1px;
      opacity: 0;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <!-- Deep-link anchor preservation -->
  <div id="simulator"></div>

  <main class="video-viewport">
    <video autoplay muted loop playsinline class="background-video">
      <source src="assets/rep/rep_hero_background.mp4" type="video/mp4">
      <source src="hero_loop.mp4" type="video/mp4">
    </video>
    <div class="ambient-overlay"></div>
  </main>
</body>
</html>
