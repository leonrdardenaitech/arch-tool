<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Part 1: The "Audit Ready" Baseline</title>
    <link href="{{ url_for('static', path='/css/output.css') }}" rel="stylesheet">
</head>
<body class="bg-gray-900 flex items-center justify-center min-h-screen">

    <div class="relative w-full max-w-5xl mx-auto shadow-2xl rounded-xl overflow-hidden">
        <!-- The V17/V16 Rendered VIP Video -->
        <video id="vip-player" class="w-full h-auto" controls>
            <source src="{{ url_for('static', path='/media/part1_audit_ready_vip.mp4') }}" type="video/mp4">
        </video>

        <!-- Interactive End-Screen Overlay -->
        <div id="interactive-overlay" class="absolute inset-0 bg-black bg-opacity-70 hidden flex-col items-center justify-center transition-opacity duration-300">
            <h2 class="text-3xl font-bold text-white mb-6">Module Complete</h2>
            <!-- Flowbite Modal Trigger -->
            <button data-modal-target="quiz-modal" data-modal-toggle="quiz-modal" class="px-8 py-4 text-lg font-semibold text-white bg-blue-600 rounded-lg hover:bg-blue-700 focus:ring-4 focus:ring-blue-300">
                Access Workbook & Quiz
            </button>
        </div>
    </div>

    <!-- Flowbite Quiz/Workbook Modal -->
    <div id="quiz-modal" tabindex="-1" aria-hidden="true" class="fixed top-0 left-0 right-0 z-50 hidden w-full p-4 overflow-x-hidden overflow-y-auto md:inset-0 h-[calc(100%-1rem)] max-h-full">
        <!-- Modal Content (To be populated by FastAPI via JS) -->
    </div>

    <!-- Flowbite JS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/flowbite/1.6.5/flowbite.min.js"></script>
    <script>
        // Trigger interactive overlay when the VIP video finishes
        document.getElementById('vip-player').addEventListener('ended', function() {
            document.getElementById('interactive-overlay').classList.remove('hidden');
            document.getElementById('interactive-overlay').classList.add('flex');
        });
    </script>
</body>
</html>
